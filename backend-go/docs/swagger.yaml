      - ai
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password, returns JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
