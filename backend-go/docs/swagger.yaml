          type: integer
        type: array
      source_platform:
        type: string
      source_url:
        type: string
      spec_json:
        items:
          type: integer
        type: array
      status:
        type: string
      supplier_id:
        type: integer
      target_currency:
        type: string
      target_platform_id:
        type: integer
      target_sale_price:
        type: number
      title:
        type: string
