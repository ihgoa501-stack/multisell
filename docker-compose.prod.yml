# LingMirror production overlay for the active Go + Next stack.
# Use only after cutover gates are green:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    environment:
      GIN_MODE: release
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: multisell
      SERVER_PORT: "8080"
      # Set through .env or host environment before production use.
      # JWT_SECRET: "<strong-secret>"
      # LLM_PROVIDER: "openai"
      # LLM_API_KEY: "<provider-key>"
    command: >
      sh -c "go build -o /tmp/lingmirror-server cmd/server/main.go &&
             /tmp/lingmirror-server"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    command: >
      sh -c "npm ci &&
             npm run build &&
             npm run start -- --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped
