# A6 — Profit Watch
# Squad: risk
# Tracks SKU-level profit margins, flags cost anomalies, and cuts losses.
agent_id: A6
name: Profit Watch
squad: risk
version: "2.0.0"
description: "利润看护：SKU 利润率、成本优化、亏损止血"

decision_points:
  - name: profit_check
    description: "逐SKU利润分析，标记异常波动"
  - name: cost_optimization
    description: "推荐成本优化措施（物流/费用/促销策略）"
  - name: profit_watch
    description: "持续监控利润趋势，触发亏损止损机制"

tools:
  - finance.profit.calculate
  - finance.profit.summary
  - platform_fee.list
  - order.read

triggers:
  - type: schedule
    interval: "1h"
    decision_point: profit_watch
  - type: event
    topic: "agent.decided.G3.discount_risk_check"
    decision_point: profit_watch
  - type: event
    topic: "order.settled"
    decision_point: profit_check

model_hint: "gpt-4o"
autonomy: supervised
risk_floor: medium

resource_limits:
  max_tokens_per_minute: 20000
  max_tokens_per_hour: 300000
  max_api_calls_per_min: 30
  max_api_calls_per_hour: 300
  max_tool_chain_depth: 3
  max_decision_duration: "45s"

memory:
  short_term_ttl: "30m"
  long_term_enabled: true
  long_term_ttl: "720h"
