<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LingMirror Sourcing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      color: #1f2937;
      background: #ffffff;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }

    .title {
      font-weight: 700;
      font-size: 15px;
      color: #111827;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #6b7280;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.connected   { background: #22c55e; }
    .status-dot.disconnected { background: #ef4444; }
    .status-dot.no_token    { background: #f59e0b; }
    .status-dot.error       { background: #ef4444; }

    .status-dot.connected   + .status-label { color: #16a34a; }
    .status-dot.disconnected + .status-label { color: #dc2626; }
    .status-dot.no_token    + .status-label { color: #d97706; }
    .status-dot.error       + .status-label { color: #dc2626; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:active { transform: scale(0.98); }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: #4f46e5; }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }
    .btn-secondary:hover:not(:disabled) { background: #e5e7eb; }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .result-card {
      margin-top: 8px;
      padding: 10px 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.5;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    .result-card.visible { display: block; }

    .result-card pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      color: #374151;
    }

    .result-card .error-text {
      color: #dc2626;
    }

    .result-card .summary {
      color: #6b7280;
      font-size: 11px;
    }

    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #9ca3af;
    }

    .footer a {
      color: #6366f1;
      text-decoration: none;
      cursor: pointer;
    }
    .footer a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(99, 102, 241, 0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">L</div>
      <span class="title">LingMirror</span>
    </div>
    <div class="status-badge">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span class="status-label" id="statusLabel">Disconnected</span>
    </div>
  </div>

  <div class="actions">
    <button id="fetchBtn" class="btn-primary" disabled>
      Fetch Current Product
    </button>
    <button id="loginBtn" class="btn-secondary">Login to LingMirror</button>
  </div>

  <div class="result-card" id="resultCard">
    <pre id="resultContent"></pre>
  </div>

  <div class="footer">
    <span>Sourcing Agent v0.1.0</span>
    <a id="settingsLink">Settings</a>
  </div>

  <script type="module" src="build/popup.js"></script>
</body>
</html>
