# 凌镜 LingMirror — 开发环境
# docker compose up -d
#
# WARNING: This file is used as the base for production (-f docker-compose.yml -f docker-compose.prod.yml). Do not hardcode production credentials.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: multisell
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_go_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d multisell"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations
    command:
      -path /migrations
      -database "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/multisell?sslmode=disable"
      up
    restart: "no"

  backend:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ./backend-go:/app
      - go_pkg_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: multisell
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SERVER_PORT: "8080"
      IMAGE_SERVICE_BASE_URL: http://image-service:8092
      IMAGE_SERVICE_SHARED_SECRET: ${IMAGE_SERVICE_SHARED_SECRET:?set IMAGE_SERVICE_SHARED_SECRET}
      IMAGE_SERVICE_EXECUTION_TOKEN_SECRET: ${IMAGE_SERVICE_EXECUTION_TOKEN_SECRET:?set IMAGE_SERVICE_EXECUTION_TOKEN_SECRET}
      IMAGE_RELEASE_ATTESTATION_SECRET: ${IMAGE_RELEASE_ATTESTATION_SECRET:?set IMAGE_RELEASE_ATTESTATION_SECRET}
      IMAGE_RELEASE_ATTESTATION_KEY_ID: ${IMAGE_RELEASE_ATTESTATION_KEY_ID:-image-release-v1}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      image-service:
        condition: service_healthy
    command: >
      sh -c "go mod download &&
             go run cmd/server/main.go"

  image-service:
    build:
      context: ./services/image-service
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      IMAGE_SERVICE_ADDR: 0.0.0.0:8092
      IMAGE_SERVICE_DATA_DIR: /data
      IMAGE_SERVICE_ENVIRONMENT: ${IMAGE_SERVICE_ENVIRONMENT:-development}
      IMAGE_SERVICE_JOB_STORE: postgres
      DATABASE_URL: ${IMAGE_SERVICE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/multisell?sslmode=disable}
      IMAGE_SERVICE_SHARED_SECRET: ${IMAGE_SERVICE_SHARED_SECRET:?set IMAGE_SERVICE_SHARED_SECRET}
      IMAGE_SERVICE_EXECUTION_TOKEN_SECRET: ${IMAGE_SERVICE_EXECUTION_TOKEN_SECRET:?set IMAGE_SERVICE_EXECUTION_TOKEN_SECRET}
      IMAGE_SERVICE_PHOTOROOM_SANDBOX_ENABLED: ${IMAGE_SERVICE_PHOTOROOM_SANDBOX_ENABLED:-false}
      IMAGE_SERVICE_PHOTOROOM_API_KEY: ${IMAGE_SERVICE_PHOTOROOM_API_KEY:-}
      IMAGE_SERVICE_PHOTOROOM_SANDBOX_ACCOUNT_CONFIRMED: ${IMAGE_SERVICE_PHOTOROOM_SANDBOX_ACCOUNT_CONFIRMED:-false}
      IMAGE_SERVICE_PHOTOROOM_TRAINING_OPT_OUT_CONFIRMED: ${IMAGE_SERVICE_PHOTOROOM_TRAINING_OPT_OUT_CONFIRMED:-false}
      IMAGE_SERVICE_OPENAI_ENABLED: ${IMAGE_SERVICE_OPENAI_ENABLED:-false}
      IMAGE_SERVICE_OPENAI_API_KEY: ${IMAGE_SERVICE_OPENAI_API_KEY:-}
    volumes:
      - image_service_data:/data
    depends_on:
      image-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  image-service-migrate:
    build:
      context: ./services/image-service
    environment:
      DATABASE_URL: ${IMAGE_SERVICE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/multisell?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["image-service-migrate"]
    restart: "no"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend-next:/app
      - frontend_next_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
             npm run dev -- --hostname 0.0.0.0 --port 3000"

  # =============================================================================
  # 数据库备份（按需运行）
  # docker compose run --rm backup
  # 生产环境通过宿主机 cron 定时执行：
  #   0 3 * * * cd /opt/multisell && docker compose run --rm backup
  # =============================================================================
  backup:
    image: postgres:15-alpine
    profiles:
      - manual
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: multisell
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - db_backups:/backups
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/backup.sh"]

volumes:
  postgres_go_data:
  go_pkg_cache:
  go_build_cache:
  frontend_next_node_modules:
  db_backups:
  image_service_data:
