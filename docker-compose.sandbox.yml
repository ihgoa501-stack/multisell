version: '3.8'

networks:
  sandbox_internal:
    internal: true
  traefik_public:
    external: true

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: multisell_sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - sandbox_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multisell_sandbox"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations:ro
    networks:
      - sandbox_internal
    command:
      - -path
      - /migrations
      - -database
      - postgresql://postgres:${DB_PASSWORD}@db:5432/multisell_sandbox?sslmode=disable
      - up

  backend:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ./backend-go:/app
      - ~/.go-pkg-cache:/go/pkg/mod:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: multisell_sandbox
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
    networks:
      - sandbox_internal
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "go mod download && go run cmd/server/main.go"

  seed:
    image: golang:1.25
    working_dir: /work
    volumes:
      - .:/work
      - ~/.go-pkg-cache:/go/pkg/mod:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: multisell_sandbox
    networks:
      - sandbox_internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["bash", "scripts/e2e_seed.sh"]

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend-next:/app
      - ~/.npm-cache:/root/.npm:ro
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api
    networks:
      - sandbox_internal
      - traefik_public
    depends_on:
      - backend
    command: >
      sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.frontend-pr-${SANDBOX_ID}.rule=Host(`pr-${SANDBOX_ID}.staging.lingmirror.com`)"
      - "traefik.http.routers.frontend-pr-${SANDBOX_ID}.service=frontend-pr-${SANDBOX_ID}"
      - "traefik.http.services.frontend-pr-${SANDBOX_ID}.loadbalancer.server.port=3000"

  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-jammy
    working_dir: /work/frontend-next/e2e
    volumes:
      - .:/work
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_BASE: http://backend:8080
      E2E_SKIP_WEB_SERVER: "1"
    networks:
      - sandbox_internal
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      seed:
        condition: service_completed_successfully
    command: >
      bash -lc "npm ci &&
                for i in \$(seq 1 90); do
                  if curl -fsS http://frontend:3000/login >/dev/null && curl -fsS http://backend:8080/api/health >/dev/null; then
                    break
                  fi
                  sleep 1
                done &&
                npm run e2e"
