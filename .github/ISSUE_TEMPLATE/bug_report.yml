name: Bug 报告 / Bug Report
description: 提交 Bug 帮助改进产品 / Report a bug to help us improve
title: "[Bug] "
labels: ["bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 提交前检查 / Before Submitting
        - 搜索现有 [Issues](https://github.com/ihgoa501-stack/multisell/issues) 确认没有重复 / Search existing issues to avoid duplicates
        - 如果是使用疑问，请使用 [Discussions](https://github.com/ihgoa501-stack/multisell/discussions) / For questions, use Discussions
        - 📖 写 Issue 指南 / Guide: [issue-example.md](https://github.com/ihgoa501-stack/multisell/blob/main/issue-example.md)

  - type: textarea
    id: description
    attributes:
      label: Bug 描述 / Description
      description: 清晰简洁地描述 Bug / A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: 如何复现 Bug / Steps to reproduce the behavior
      placeholder: |
        1. 打开 '...'
        2. 点击 '....'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected Behavior
      description: 你认为应该发生什么 / What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual Behavior
      description: 实际发生了什么 / What actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错日志 / Error Logs & Screenshots
      description: 粘贴报错信息或添加截图 / Paste error logs or add screenshots
      render: shell

  - type: input
    id: version
    attributes:
      label: 软件版本 / Version
      description: VERSION 文件中的版本号，或 Git commit SHA / Version from VERSION file or commit SHA
      placeholder: "v0.2.1"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 填写相关信息 / Fill in relevant environment details
      placeholder: |
        - OS: macOS 14.5 / Ubuntu 24.04
        - Browser: Chrome 125 (如果涉及前端 / if frontend-related)
        - Docker: 24.0.7 (如果容器部署 / if Docker-based)
        - DB: PostgreSQL 15
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我确认 Issue 中没有敏感的业务数据 / I confirm there is no sensitive business data in this issue
          required: true
