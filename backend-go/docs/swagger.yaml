      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lingmirror_backend-go_internal_response.Result'
      security:
      - BearerAuth: []
      summary: AgentOS system status
      tags:
      - agentos
  /agentos/work-items:
    get:
      description: Get pending work items from all agents
      parameters:
      - description: Max items (default 50)
        in: query
        name: limit
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by risk level
        in: query
        name: risk_level
        type: string
      - description: Filter by agent ID
        in: query
        name: agent_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lingmirror_backend-go_internal_response.Result'
      security:
      - BearerAuth: []
      summary: List work items
      tags:
      - agentos
  /agentos/work-items/{id}:
    get:
      description: Get detail of a specific work item by ID
      parameters:
      - description: Work item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lingmirror_backend-go_internal_response.Result'
      security:
      - BearerAuth: []
      summary: Get work item detail
      tags:
      - agentos
  /ai/agents:
