route:
  receiver: "default"
  repeat_interval: 4h

receivers:
  - name: "default"
    slack_configs:
      - api_url_file: "/run/secrets/slack_webhook_url"
        channel: "#alerts"
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
# ponytail: Slack only. Add PagerDuty when on-call rotation exists.
