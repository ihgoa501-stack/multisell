      security:
      - BearerAuth: []
      summary: Agent specs
      tags:
      - ai
  /ai/chat:
    post:
      consumes:
      - application/json
      description: Send a message to the AI assistant and get a response (supports
        streaming)
      parameters:
      - description: Chat message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_ai.ChatInput'
