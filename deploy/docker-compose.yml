# LingMirror 生产部署配置
# 使用: docker compose --env-file .env up -d

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: multisell
      POSTGRES_USER: ${DB_USER:-multisell}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-multisell} -d multisell"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go 后端 API
  backend:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-multisell}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: multisell
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
      GIN_MODE: release
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}

  # Next.js 前端
  frontend:
    build:
      context: ../frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8080/api}
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Nginx 反向代理（可选，用于 80/443 端口）
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
