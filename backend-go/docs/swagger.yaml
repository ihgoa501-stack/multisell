    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  github_com_lingmirror_backend-go_internal_response.Result:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  internal_ai.ChatInput:
    properties:
      agent_id:
        type: string
      context:
        additionalProperties: true
        type: object
      message:
        type: string
      stream:
        type: boolean
    required:
    - message
    type: object
  internal_ai.RunAgentRequest:
    properties:
      agent_id:
        type: string
      context:
        additionalProperties: true
        type: object
      decision_point:
        type: string
      parent_trace_id:
        type: string
      stream:
        type: boolean
      user_id:
        type: integer
    required:
    - agent_id
    - decision_point
    type: object
  internal_auth.UserVO:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      status:
        type: integer
      username:
        type: string
    type: object
  internal_auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_auth.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.registerRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        description: ignored on purpose — hardcoded in Register for security
        type: string
      username:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  internal_domain_candidate.CreateCandidateInput:
