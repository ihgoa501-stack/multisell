# 凌镜 LingMirror — 生产部署覆写
# 使用: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations
    command:
      -path /migrations
      -database "postgresql://${DB_USER:?required}:${DB_PASSWORD:?required}@db:5432/${DB_NAME:?required}?sslmode=disable"
      up
    restart: "no"
    logging: *default-logging

  backend:
    image: lingmirror-backend:${IMAGE_TAG:-local}
    build: ./backend-go
    ports: !reset []
    volumes: !reset []
    command: !reset null
    logging: *default-logging
    environment:
      GIN_MODE: release
      SERVER_MODE: release
      DB_HOST: db
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:?required}"
      DB_PASSWORD: "${DB_PASSWORD:?required}"
      DB_NAME: "${DB_NAME:?required}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-100}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
      DB_CONN_MAX_IDLE_TIME: "${DB_CONN_MAX_IDLE_TIME:-5m}"
      JWT_SECRET: "${JWT_SECRET:?required}"
      JWT_KEY_ID: "${JWT_KEY_ID:-current}"
      JWT_PREVIOUS_KEYS_JSON: "${JWT_PREVIOUS_KEYS_JSON:-}"
      AUTH_REGISTRATION_ENABLED: "false"
      SWAGGER_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: "https://${DOMAIN:?required}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      SERVER_PORT: "8080"
      SERVER_READ_HEADER_TIMEOUT: "${SERVER_READ_HEADER_TIMEOUT:-5s}"
      SERVER_READ_TIMEOUT: "${SERVER_READ_TIMEOUT:-60s}"
      SERVER_WRITE_TIMEOUT: "${SERVER_WRITE_TIMEOUT:-0s}"
      SERVER_IDLE_TIMEOUT: "${SERVER_IDLE_TIMEOUT:-120s}"
      SERVER_SHUTDOWN_TIMEOUT: "${SERVER_SHUTDOWN_TIMEOUT:-10s}"
      SERVER_MAX_HEADER_BYTES: "${SERVER_MAX_HEADER_BYTES:-1048576}"
      SERVER_MAX_REQUEST_BODY_BYTES: "${SERVER_MAX_REQUEST_BODY_BYTES:-33554432}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/ready >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    ports: !reset []
    environment:
      POSTGRES_DB: "${DB_NAME:?required}"
      POSTGRES_USER: "${DB_USER:?required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?required}"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?required} -d ${DB_NAME:?required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: lingmirror-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend-next
      args:
        NEXT_PUBLIC_API_URL: /api
    ports: !reset []
    volumes: !reset []
    command: !reset null
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  backup:
    image: lingmirror-backup:${IMAGE_TAG:-local}
    build: ./ops/backup
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:?required}"
      DB_PASSWORD: "${DB_PASSWORD:?required}"
      DB_NAME: "${DB_NAME:?required}"
      BACKUP_DIR: /backups
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
      BACKUP_REQUIRE_OFFSITE: "${BACKUP_REQUIRE_OFFSITE:-true}"
      BACKUP_REQUIRE_IMMUTABLE_OFFSITE: "${BACKUP_REQUIRE_IMMUTABLE_OFFSITE:-true}"
      BACKUP_S3_SSE: "${BACKUP_S3_SSE:-AES256}"
    command: ["sh", "/usr/local/bin/backup.sh"]

  audit-checkpoint:
    image: lingmirror-backup:${IMAGE_TAG:-local}
    build: ./ops/backup
    profiles: ["manual"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:?required}"
      DB_PASSWORD: "${DB_PASSWORD:?required}"
      DB_NAME: "${DB_NAME:?required}"
      AUDIT_CHECKPOINT_KEY: "${AUDIT_CHECKPOINT_KEY:?required}"
      AUDIT_CHECKPOINT_DIR: /checkpoints
      AUDIT_CHECKPOINT_S3_URI: "${AUDIT_CHECKPOINT_S3_URI:-}"
      AUDIT_CHECKPOINT_REQUIRE_OFFSITE: "${AUDIT_CHECKPOINT_REQUIRE_OFFSITE:-true}"
      AUDIT_CHECKPOINT_REQUIRE_IMMUTABLE_OFFSITE: "${AUDIT_CHECKPOINT_REQUIRE_IMMUTABLE_OFFSITE:-true}"
    volumes:
      - ./scripts/audit_checkpoint.sh:/usr/local/bin/audit_checkpoint.sh:ro
      - db_backups:/checkpoints
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/audit_checkpoint.sh"]
    restart: "no"
    logging: *default-logging

  # ── BEGIN: Caddy reverse proxy (unified entry point with auto TLS) ──
  caddy:
    image: caddy:2.11.4-alpine
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@lingmirror.com}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
  # ── END: Caddy reverse proxy ──

volumes:
  caddy_data:
  caddy_config:
