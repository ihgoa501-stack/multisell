<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>凌镜 AI 选品助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">镜</div>
      <span class="title">凌镜 选品助手</span>
    </div>
    <div class="status-badge">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span class="status-label" id="statusLabel">未连接</span>
    </div>
  </div>

  <div class="actions">
    <button id="fetchBtn" class="btn-primary" disabled>
      <span class="btn-icon">⟳</span> 采集当前商品
    </button>
    <button id="loginBtn" class="btn-secondary">登录凌镜</button>
  </div>

  <div class="result-card" id="resultCard">
    <pre id="resultContent"></pre>
  </div>

  <div class="footer">
    <span>v0.1.0</span>
    <a id="settingsLink">设置</a>
  </div>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
