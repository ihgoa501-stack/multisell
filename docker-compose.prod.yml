# 凌镜 LingMirror — 生产部署覆写
# 使用: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    environment:
      DEBUG: "false"
      AUTH_ENABLED: "true"
      # 生产环境必须设置以下密钥（通过 .env 或宿主环境变量传入）
      # ENCRYPTION_KEY: "<your-32-char-hex-key>"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    restart: unless-stopped
