      - auth
  /auth/me:
    get:
      description: Return the authenticated user's profile info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lingmirror_backend-go_internal_response.Result'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.UserVO'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token for a new access token
      parameters:
      - description: Refresh token
        in: body
        name: body
