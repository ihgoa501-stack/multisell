repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Docker Compose merge tags are valid Compose syntax but are not part of
        # generic YAML. Dedicated compose verification scripts cover these files.
        exclude: ^docker-compose\.(prod|ip|private)\.yml$
      - id: check-added-large-files
        args: ["--maxkb=500"]
