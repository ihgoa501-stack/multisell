  internal_domain_candidate.UpdateCandidateInput:
    properties:
      brand_id:
        type: integer
      category_id:
        type: integer
      description:
        type: string
      destination_country:
        type: string
      hs_code:
        type: string
      images:
        items:
          type: integer
        type: array
      main_image:
        type: string
      origin_country:
        type: string
      package_height_cm:
        type: number
      package_length_cm:
        type: number
      package_weight_kg:
        type: number
      package_width_cm:
        type: number
      purchase_currency:
        type: string
      purchase_price:
        type: number
      spec_json:
        items:
