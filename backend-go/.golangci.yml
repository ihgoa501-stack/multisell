linters:
  disable:
    - errcheck

issues:
  exclude-rules:
    # Test files commonly have unused helpers shared across test functions.
    - path: _test\.go
      linters:
        - unused
    # Pre-existing unused declarations in main code (not introduced by us).
    - path: internal/agent/impl/product_scout.go
      text: "candidateItem"
      linters:
        - unused
    - path: internal/agent/impl/profit_watch.go
      text: "profitWatchOptionalFields|absf"
      linters:
        - unused
    - path: internal/agent/impl/settlement_recon.go
      text: "RequiredFields|requiredFields"
      linters:
        - unused
    - path: internal/aios/knowledge/engine.go
      linters:
        - gosimple
    - path: internal/aios/guardrails/execution_guard.go
      linters:
        - gosimple
    - path: internal/agent/impl/settlement_recon.go
      text: "ineffectual assignment"
      linters:
        - ineffassign
