info:
  contact: {}
paths:
  /agentos:
    get:
      description: Get AgentOS cockpit dashboard overview
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lingmirror_backend-go_internal_response.Result'
      security:
      - BearerAuth: []
      summary: AgentOS overview
      tags:
      - agentos
  /agentos/autonomy:
    get:
      description: Get the autonomy configuration and current level for all agents
      produces:
      - application/json
