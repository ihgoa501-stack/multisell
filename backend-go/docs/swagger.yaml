basePath: /api/v1
definitions:
  ai.ChatInput:
    properties:
      agent_id:
        type: string
      context:
        additionalProperties: true
        type: object
      message:
        type: string
      stream:
        type: boolean
    required:
    - message
    type: object
  ai.RunAgentRequest:
    properties:
      agent_id:
        type: string
      context:
        additionalProperties: true
        type: object
      decision_point:
        type: string
      parent_trace_id:
        type: string
      stream:
        type: boolean
      user_id:
        type: integer
    required:
    - agent_id
    - decision_point
    type: object
  auth.UserVO:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      status:
        type: integer
      username:
        type: string
    type: object
  auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.registerRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        description: ignored on purpose — hardcoded in Register for security
        type: string
      username:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  candidate.CreateCandidateInput:
    type: object
  candidate.FillField:
    properties:
      field:
        type: string
      value: {}
    required:
    - field
    - value
    type: object
  candidate.FillFieldsInput:
    properties:
      fields:
        items:
          $ref: '#/definitions/candidate.FillField'
        type: array
    required:
    - fields
    type: object
  candidate.UpdateCandidateInput:
    type: object
  integrations.PublishToOzonInput:
    properties:
      account_id:
        type: integer
      approval_id:
        type: integer
      currency_code:
        type: string
      image_url:
        type: string
      price:
        type: number
      product_id:
        type: integer
    required:
    - account_id
    - price
    - product_id
    type: object
  loop.BatchEvaluateInput:
    properties:
      product_ids:
        items:
          type: integer
        type: array
      triggered_by:
        type: string
    required:
    - product_ids
    type: object
  reliability.BudgetInput:
    properties:
      monthly_limit_usd:
        minimum: 0
        type: number
    type: object
  response.PageResult:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  response.Result:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Cross-border e-commerce AI AgentOS
  title: LingMirror API
  version: 0.3.0
paths:
  /agentos:
    get:
      description: Get AgentOS cockpit dashboard overview
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: AgentOS overview
      tags:
      - agentos
  /agentos/autonomy:
    get:
      description: Get the autonomy configuration and current level for all agents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Agent autonomy status
      tags:
      - agentos
  /agentos/status:
    get:
      description: Get the current runtime status of the AgentOS
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: AgentOS system status
      tags:
      - agentos
  /agentos/work-items:
    get:
      description: Get pending work items from all agents
      parameters:
      - description: Max items (default 50)
        in: query
        name: limit
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by risk level
        in: query
        name: risk_level
        type: string
      - description: Filter by agent ID
        in: query
        name: agent_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: List work items
      tags:
      - agentos
  /agentos/work-items/{id}:
    get:
      description: Get detail of a specific work item by ID
      parameters:
      - description: Work item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Get work item detail
      tags:
      - agentos
  /ai/agents:
    get:
      description: Get list of all registered AI agents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Agent roster
      tags:
      - ai
  /ai/agents/specs:
    get:
      description: Get the full registry of agent specifications
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Agent specs
      tags:
      - ai
  /ai/chat:
    post:
      consumes:
      - application/json
      description: Send a message to the AI assistant and get a response (supports
        streaming)
      parameters:
      - description: Chat message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ai.ChatInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: AI chat
      tags:
      - ai
  /ai/run:
    post:
      consumes:
      - application/json
      description: Execute an agent decision point with the given context
      parameters:
      - description: Agent run request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ai.RunAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Run AI agent
      tags:
      - ai
  /ai/traces:
    get:
      consumes:
      - application/json
      description: Get paginated list of AI agent execution traces
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Filter by agent ID
        in: query
        name: agent_id
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by decision point
        in: query
        name: decision_point
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResult'
      security:
      - BearerAuth: []
      summary: List AI traces
      tags:
      - ai
  /ai/traces/{trace_id}:
    get:
      description: Get a single execution trace by trace ID
      parameters:
      - description: Trace UUID
        in: path
        name: trace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Get AI trace
      tags:
      - ai
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password, returns JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      summary: User login
      tags:
      - auth
  /auth/me:
    get:
      description: Return the authenticated user's profile info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Result'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserVO'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token for a new access token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      summary: Refresh JWT token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new operator account. Role is hardcoded to "operator"
        for security.
      parameters:
      - description: Registration info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Result'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserVO'
              type: object
      summary: Register a new user
      tags:
      - auth
  /candidates:
    get:
      consumes:
      - application/json
      description: Get paginated list of candidate products
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Search keyword
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResult'
      security:
      - BearerAuth: []
      summary: List candidates
      tags:
      - candidates
    post:
      consumes:
      - application/json
      description: Create a new candidate product
      parameters:
      - description: Candidate data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/candidate.CreateCandidateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Create candidate
      tags:
      - candidates
  /candidates/{id}:
    delete:
      description: Delete a candidate product by ID
      parameters:
      - description: Candidate ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Delete candidate
      tags:
      - candidates
    get:
      description: Get a single candidate product by ID
      parameters:
      - description: Candidate ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Get candidate detail
      tags:
      - candidates
    put:
      consumes:
      - application/json
      description: Update an existing candidate product
      parameters:
      - description: Candidate ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/candidate.UpdateCandidateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Update candidate
      tags:
      - candidates
  /candidates/{id}/fields:
    put:
      consumes:
      - application/json
      description: Manually fill completeness fields for a candidate
      parameters:
      - description: Candidate ID
        in: path
        name: id
        required: true
        type: integer
      - description: Field values
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/candidate.FillFieldsInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Fill candidate fields
      tags:
      - candidates
  /candidates/count:
    get:
      description: Get total count of candidate products
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Count candidates
      tags:
      - candidates
  /dashboard/brief:
    get:
      description: Get the seller's daily workspace composite brief
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Daily brief
      tags:
      - dashboard
  /dashboard/exceptions:
    get:
      description: Get exception distribution data for the dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Exception distribution
      tags:
      - dashboard
  /dashboard/inventory:
    get:
      description: Get inventory health data for the dashboard
      parameters:
      - description: Max items (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Inventory health
      tags:
      - dashboard
  /dashboard/orders:
    get:
      description: Get order trend data for the dashboard
      parameters:
      - description: Number of days (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Order trends
      tags:
      - dashboard
  /dashboard/overview:
    get:
      description: Get dashboard overview with key metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Dashboard overview
      tags:
      - dashboard
  /dashboard/rejection-reasons:
    get:
      description: Get rejection reason statistics for the dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Rejection reason stats
      tags:
      - dashboard
  /loop/batch-evaluate:
    post:
      consumes:
      - application/json
      description: Run the full evaluation pipeline for multiple products at once
      parameters:
      - description: Batch evaluate input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/loop.BatchEvaluateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Batch evaluate products
      tags:
      - loop
  /order:
    get:
      consumes:
      - application/json
      description: Get paginated list of orders
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by platform ID
        in: query
        name: platform_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResult'
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - orders
  /order/{id}:
    get:
      description: Get order detail by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Get order
      tags:
      - orders
  /order/{id}/status:
    post:
      consumes:
      - application/json
      description: Transition order status via state machine
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status transition
        in: body
        name: body
        required: true
        schema:
          properties:
            from:
              type: string
            operator:
              type: string
            remark:
              type: string
            to:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - orders
  /order/summary:
    get:
      description: Get order summary statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Order summary
      tags:
      - orders
  /owner/agent-activity:
    get:
      description: Get recent agent activity timeline
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Agent activity
      tags:
      - owner
  /owner/decision-queue:
    get:
      description: Get paginated decision queue with filtering, sorting, and status
        summary
      parameters:
      - description: 'Filter by status: waiting_data, ready_for_decision, pending_approval,
          executing, completed, failed'
        in: query
        name: display_status
        type: string
      - description: Minimum completeness score filter
        in: query
        name: min_completeness_score
        type: number
      - description: Minimum profit margin filter
        in: query
        name: min_profit_margin
        type: number
      - description: Filter by target platform ID
        in: query
        name: platform_id
        type: integer
      - description: Filter by destination country
        in: query
        name: destination_country
        type: string
      - description: Search by title or reason
        in: query
        name: search
        type: string
      - description: 'Sort field: completeness_score, profit_margin, estimated_profit,
          confidence, created_at'
        in: query
        name: sort_by
        type: string
      - description: 'Sort order: asc or desc'
        in: query
        name: sort_order
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Decision queue
      tags:
      - owner
  /owner/platform-sync:
    get:
      description: Get sync status of all connected platform accounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Platform sync status
      tags:
      - owner
  /owner/risk-summary:
    get:
      description: Get owner cockpit risk summary
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Risk summary
      tags:
      - owner
  /owner/suggestions:
    get:
      description: Get AI-generated suggestions for the business owner
      parameters:
      - description: Max items (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Owner suggestions
      tags:
      - owner
  /platform-integrations:
    get:
      consumes:
      - application/json
      description: Get paginated list of platform integration accounts
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Filter by platform
        in: query
        name: platform_id
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PageResult'
      security:
      - BearerAuth: []
      summary: List integrations
      tags:
      - integrations
  /platform-integrations/{id}/sync:
    post:
      description: Trigger a sync of orders and products from the platform
      parameters:
      - description: Integration account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Sync integration
      tags:
      - integrations
  /platform-integrations/{id}/test:
    post:
      description: Test whether a platform integration account has valid credentials
      parameters:
      - description: Integration account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Test integration connection
      tags:
      - integrations
  /reliability/budget:
    get:
      description: View current LLM monthly budget and spend
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: Get LLM monthly budget
      tags:
      - reliability
    put:
      consumes:
      - application/json
      description: Set the monthly spending limit for LLM API calls
      parameters:
      - description: Budget settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/reliability.BudgetInput'
      produces:
      - application/json
