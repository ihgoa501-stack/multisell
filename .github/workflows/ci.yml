name: CI

on:
  push:
    branches: [main, infra-q3-buildout]
  pull_request:
    branches: [main, infra-q3-buildout]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.0
          golangci-lint run ./... --timeout=5m

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: multisell_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Run migrations
        run: migrate -path migrations -database "postgresql://postgres:postgres@localhost:5432/multisell_test?sslmode=disable" up
      - name: govulncheck
        continue-on-error: true
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: Run tests
        run: go test ./... -v -count=1 -timeout=180s
        env:
          DB_DRIVER: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: multisell_test
          DB_SSLMODE: disable

  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test --if-present

  # ==========================================
  # CD: 自动部署到生产（仅合并到 main 时触发）
  # ==========================================
  deploy:
    if: github.ref == 'refs/heads/infra-q3-buildout' && github.event_name == 'push'
    needs: [go-lint, go-test, next-build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/multisell
            ./scripts/deploy.sh
