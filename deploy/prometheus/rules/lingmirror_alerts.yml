groups:
  - name: lingmirror
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="lingmirror-backend"} == 0
        for: 1m
        annotations:
          summary: "Backend is down"
          description: "Backend service has been unreachable for >1m"

      - alert: HighErrorRate
        expr: |
          rate(multisell_http_requests_total{status=~"5.."}[5m])
          /
          rate(multisell_http_requests_total[5m])
          > 0.05
        for: 3m
        annotations:
          summary: "High error rate ({{ $value | humanizePercentage }})"
          description: "5xx error rate exceeds 5% over 5m window"

      - alert: HighGCHeap
        expr: go_memstats_next_gc_bytes / go_memstats_heap_alloc_bytes < 1.5
        for: 5m
        annotations:
          summary: "GC pressure high"
          description: "Heap is within 50% of GC trigger — investigate memory leaks"

      - alert: DLQNonEmpty
        expr: increase(multisell_events_dlq_total[5m]) > 0
        annotations:
          summary: "Events entered the dead-letter queue"
          description: "{{ $value }} event handler failures entered the DLQ in 5m — inspect persisted event_dlq rows"

      - alert: DatabasePoolSaturation
        expr: multisell_db_in_use_connections / clamp_min(multisell_db_open_connections, 1) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool saturation"
          description: "More than 80% of open database connections have been in use for 5m"

      - alert: AuditWriteFailure
        expr: increase(multisell_audit_writes_total{result="failure"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Audit writes are failing"
          description: "At least one awaited audit write failed in the last 5m"

      - alert: AuditIntegrityBroken
        expr: multisell_audit_integrity == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audit hash chain integrity check failed"
          description: "The operation_log predecessor hash chain is broken or could not be verified"
# ponytail: DB pool exhaustion via pg_stat_activity exporter, add when deployed.

      # ── AI Pipeline alerts ──────────────────────────────────────────────

      - alert: EventBusQueueBackpressure
        expr: |
          multisell_events_queue_depth{priority="0"} > 200
          or multisell_events_queue_depth{priority="1"} > 100
          or multisell_events_queue_depth{priority="2"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EventBus queue backpressure (priority {{ $labels.priority }})"
          description: "Priority {{ $labels.priority }} queue at {{ $value }} events (>80% buffer) — handlers may be slow or blocked"

      - alert: SchedulerPublishErrors
        expr: rate(multisell_scheduler_tick_errors_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduler tick publishing failing"
          description: "Scheduler is failing to publish tick events — agent scheduling may be degraded"

      - alert: AgentHandlerErrors
        expr: rate(multisell_events_handler_errors_total{topic=~"scheduler\\.tick\\..*"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent handler errors on scheduler tick topics"
          description: "Handler errors on agent scheduler ticks — LLM/agent execution failures may be occurring"
# ponytail: uses handler errors on scheduler.tick.* topics as proxy for LLM failures. No direct multisell_llm_errors_total metric exists — add one when AI pipeline needs exact error tracking.

      - alert: AgentHeartbeatMissed
        expr: multisell_agent_missed_heartbeats > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent {{ $labels.agent_id }} missed {{ $value }} heartbeats"
          description: "Agent {{ $labels.agent_id }} has missed {{ $value }} consecutive heartbeats — may be unresponsive"

      - alert: AgentInstanceDown
        expr: multisell_agent_instance_state == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Agent {{ $labels.agent_id }} stopped"
          description: "Agent {{ $labels.agent_id }} instance is in Stopped state — investigate immediately"
      - alert: ToolBridgeCircuitOpen
        expr: multisell_tool_circuit_open == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ToolBridge circuit open for {{ $labels.tool }}"
          description: "External tool calls are being rejected after repeated provider failures"

      - alert: ToolBridgeRepeatedFailures
        expr: sum by (tool) (increase(multisell_tool_calls_total{result=~"failure_attempt_.*"}[5m])) >= 5
        labels:
          severity: warning
        annotations:
          summary: "Repeated ToolBridge failures for {{ $labels.tool }}"
          description: "At least five external call attempts failed in 5m"

      - alert: SentryErrorSpike
        expr: |
          rate(multisell_http_requests_total{status=~"5.."}[5m])
          > 3 * rate(multisell_http_requests_total{status=~"5.."}[5m] offset 10m)
          and rate(multisell_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate spike ({{ $value | humanizePercentage }})"
          description: "5xx rate is 3x higher than 10 minutes ago — possible Sentry-worthy incident"
