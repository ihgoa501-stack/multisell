# LingMirror E2E acceptance environment.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up --abort-on-container-exit --exit-code-from e2e
#   docker compose -f docker-compose.e2e.yml down -v

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: multisell_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multisell_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations:ro
    command:
      -path /migrations
      -database "postgresql://postgres:postgres@db:5432/multisell_e2e?sslmode=disable"
      up
    restart: "no"

  backend:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ./backend-go:/app
      - e2e_go_pkg_cache:/go/pkg/mod
      - e2e_go_build_cache:/root/.cache/go-build
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: multisell_e2e
      JWT_SECRET: e2e-jwt-secret
      SERVER_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "go mod download &&
             go run cmd/server/main.go"

  seed:
    image: golang:1.25
    working_dir: /work
    volumes:
      - .:/work
      - e2e_go_pkg_cache:/go/pkg/mod
      - e2e_go_build_cache:/root/.cache/go-build
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: multisell_e2e
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["bash", "scripts/e2e_seed.sh"]
    restart: "no"

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend-next:/app
      - e2e_frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api
    depends_on:
      - backend
    command: >
      sh -c "npm ci &&
             npm run dev -- --hostname 0.0.0.0 --port 3000"

  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-jammy
    working_dir: /work/frontend-next/e2e
    volumes:
      - .:/work
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_BASE: http://backend:8080
      E2E_SKIP_WEB_SERVER: "1"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      seed:
        condition: service_completed_successfully
    command: >
      bash -lc "npm ci &&
                for i in $(seq 1 90); do
                  if curl -fsS http://frontend:3000/login >/dev/null && curl -fsS http://backend:8080/api/health >/dev/null; then
                    break
                  fi
                  sleep 1
                done &&
                curl -fsS http://frontend:3000/login >/dev/null &&
                curl -fsS http://backend:8080/api/health >/dev/null &&
                npm run e2e"

volumes:
  e2e_go_pkg_cache:
  e2e_go_build_cache:
  e2e_frontend_node_modules:
