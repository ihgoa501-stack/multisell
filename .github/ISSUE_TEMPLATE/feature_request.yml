name: 功能建议 / Feature Request
description: 提出新功能想法 / Suggest an idea for this project
title: "[Feature] "
labels: ["enhancement", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 提交前检查 / Before Submitting
        - 搜索现有 [Issues](https://github.com/ihgoa501-stack/multisell/issues) 确认没有重复 / Search existing issues to avoid duplicates
        - 如果是不成熟的想法或讨论，请先使用 [Discussions](https://github.com/ihgoa501-stack/multisell/discussions) / For early-stage ideas, use Discussions first
        - 📖 写 Issue 指南 / Guide: [issue-example.md](https://github.com/ihgoa501-stack/multisell/blob/main/issue-example.md)

  - type: textarea
    id: background
    attributes:
      label: 需求背景 / Background
      description: 这个功能解决了什么问题？为什么需要它？/ What problem does this solve? Why is it needed?
      placeholder: 目前我们在做 XXX 的时候，每次都要手动处理……这很耗时且容易出错。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed Solution
      description: 清晰描述你期望的行为 / A clear description of what you want to happen
      placeholder: 希望系统能自动检测 XXX 并执行 YYY……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives Considered
      description: 你还考虑过哪些其他方案？/ What alternatives have you considered?
      placeholder: 我们试过用 ZZZ 方案，但是因为 …… 不太适用。

  - type: textarea
    id: context
    attributes:
      label: 适用场景 / Use Case
      description: 谁会用到这个功能？在什么场景下？/ Who will use this? In what scenario?
      placeholder: 运营团队每天处理大量商品上架时，可以自动完成……
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我确认这个需求已有初步讨论，不是临时想法 / I confirm this has been discussed and is not a spur-of-the-moment idea
        - label: 我愿意参与功能验证 / I'm willing to participate in testing this feature
