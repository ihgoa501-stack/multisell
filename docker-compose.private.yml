# Owner-only private deployment overlay.
# Access exclusively through an SSH tunnel:
#   ssh -N -L 8088:127.0.0.1:8088 lingmirror
services:
  backend:
    environment:
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:${PRIVATE_PORT:-8088},http://localhost:${PRIVATE_PORT:-8088}"

  backup:
    profiles: ["manual"]
    environment:
      BACKUP_REQUIRE_OFFSITE: "false"
      BACKUP_REQUIRE_IMMUTABLE_OFFSITE: "false"

  audit-checkpoint:
    environment:
      AUDIT_CHECKPOINT_REQUIRE_OFFSITE: "false"
      AUDIT_CHECKPOINT_REQUIRE_IMMUTABLE_OFFSITE: "false"

  caddy:
    ports: !override
      - "127.0.0.1:${PRIVATE_PORT:-8088}:8088"
    volumes: !override
      - ./Caddyfile.private:/etc/caddy/Caddyfile:ro
    environment: !reset []
