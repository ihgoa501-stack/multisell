name: CI

on:
  push:
    branches: [main, infra-q3-buildout]
  pull_request:
    branches: [main, infra-q3-buildout]
  schedule:
    - cron: '0 6 * * *'   # UTC 06:00 daily — triggers daily-health-report

jobs:
  # ==========================================
  # Governance checks: doc drift + known issues
  # ==========================================
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check documentation drift
        run: |
          chmod +x scripts/check_doc_drift.sh
          ./scripts/check_doc_drift.sh
      - name: Check known issue deadlines
        run: |
          chmod +x scripts/check_known_issues.sh
          ./scripts/check_known_issues.sh
      - name: Check audit coverage
        run: |
          chmod +x scripts/check_audit_coverage.sh
          ./scripts/check_audit_coverage.sh

  # ==========================================
  # PR compliance: validate template checkboxes
  # ==========================================
  pr-compliance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate PR template checkboxes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          chmod +x scripts/verify_pr.py
          echo "$PR_BODY" | python3 scripts/verify_pr.py

  # ==========================================
  # Daily health report (scheduled only)
  # ==========================================
  daily-health-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run daily health report
        run: |
          chmod +x scripts/daily_health_report.sh
          ./scripts/daily_health_report.sh

  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.0
          golangci-lint run ./... --timeout=5m

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: multisell_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Run migrations
        run: migrate -path migrations -database "postgresql://postgres:postgres@localhost:5432/multisell_test?sslmode=disable" up
      - name: Check latest migration rollback
        run: ../scripts/check_migrations.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multisell_test?sslmode=disable
      - name: govulncheck
        continue-on-error: true
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: Run tests
        run: go test ./... -v -count=1 -timeout=180s
        env:
          DB_DRIVER: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: multisell_test
          DB_SSLMODE: disable

  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test --if-present
      - name: Lint
        run: npm run lint

  e2e-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next/e2e
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: multisell_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/e2e/package-lock.json
      - name: Install migrate CLI
        working-directory: backend-go
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Run migrations
        working-directory: backend-go
        run: migrate -path migrations -database "postgresql://postgres:postgres@localhost:5432/multisell_e2e?sslmode=disable" up
      - name: Check latest migration rollback
        working-directory: backend-go
        run: ../scripts/check_migrations.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multisell_e2e?sslmode=disable
      - name: Install frontend dependencies (for web server)
        run: cd .. && npm ci
      - name: Install e2e dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend-go
        run: |
          go run cmd/server/main.go > /tmp/lingmirror-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lingmirror-backend.log
          exit 1
        env:
          DB_DRIVER: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: multisell_e2e
          DB_SSLMODE: disable
          JWT_SECRET: ci-e2e-jwt-secret
      - name: Seed E2E data
        run: ../scripts/e2e_seed.sh
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: multisell_e2e
      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          E2E_API_BASE: http://localhost:8080

  # ==========================================
  # CD: 自动部署到生产（仅合并到 main 时触发）
  # ==========================================
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [go-lint, go-test, next-build, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/multisell
            ./scripts/deploy.sh

  # ==========================================
  # Push Docker images to GitHub Container Registry
  # ==========================================
  push-images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [go-lint, go-test, next-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          V=$(cat VERSION 2>/dev/null || echo "0.0.0")
          echo "backend=ghcr.io/${{ github.repository }}/backend:v${V}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${{ github.repository }}/frontend:v${V}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend-go
          push: true
          tags: ${{ steps.meta.outputs.backend }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend-next
          push: true
          tags: ${{ steps.meta.outputs.frontend }}

  # ==========================================
  # Deploy notification
  # ==========================================
  notify:
    if: always()
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        if: secrets.SLACK_WEBHOOK_URL
        with:
          payload: |
            {
              "text": "LingMirror deploy ${{ needs.deploy.result == 'success' && 'succeeded' || needs.deploy.result == 'failure' && 'failed' || 'skipped' }} — ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
