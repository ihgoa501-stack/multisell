# 凌镜 LingMirror — 生产部署覆写
# 使用: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations
    command:
      -path /migrations
      -database "postgresql://postgres:postgres@db:5432/multisell?sslmode=disable"
      up
    restart: "no"

  backend:
    build: ./backend-go
    environment:
      GIN_MODE: release
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: multisell
      SERVER_PORT: "8080"
      # Set through .env or host environment before production use.
      # JWT_SECRET: "<strong-secret>"
      # LLM_PROVIDER: "openai"
      # LLM_API_KEY: "<provider-key>"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend-next
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    restart: unless-stopped

  # ── BEGIN: Caddy reverse proxy (unified entry point with auto TLS) ──
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@lingmirror.com}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
  # ── END: Caddy reverse proxy ──

volumes:
  caddy_data:
  caddy_config:
