services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: product_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/product_management
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/product_management
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/product_management_test
      DEBUG: "true"
      AUTH_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
