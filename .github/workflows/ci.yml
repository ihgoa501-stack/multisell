name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, infra-q3-buildout]
  pull_request:
    branches: [main, infra-q3-buildout]
  schedule:
    - cron: '0 6 * * *'   # UTC 06:00 daily — triggers daily-health-report

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================
  # Governance checks: doc drift + known issues
  # ==========================================
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Check auto-generated docs are up to date
        working-directory: backend-go
        run: |
          go run cmd/docgen/main.go
          git diff --exit-code -- docs/auto/ || {
            echo "ERROR: Auto-generated docs are stale. Run 'make docs' in backend-go/ and commit the changes."
            exit 1
          }
      - name: Check documentation drift
        run: |
          chmod +x scripts/check_doc_drift.sh
          ./scripts/check_doc_drift.sh
      - name: Check known issue deadlines
        run: |
          chmod +x scripts/check_known_issues.sh
          ./scripts/check_known_issues.sh
      - name: Check audit coverage
        run: |
          chmod +x scripts/check_audit_coverage.sh
          ./scripts/check_audit_coverage.sh
      - name: Verify production Compose boundary
        run: |
          chmod +x scripts/verify_prod_compose.sh scripts/verify_private_compose.sh scripts/verify_ip_compose.sh
          ./scripts/verify_prod_compose.sh
          ./scripts/verify_private_compose.sh
          ./scripts/verify_ip_compose.sh
      - name: Validate production Caddy configuration
        run: |
          docker run --rm \
            -e DOMAIN=example.invalid -e ACME_EMAIL=ops@example.invalid \
            -v "$PWD/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Verify backup fail-closed contract
        run: |
          chmod +x scripts/backup.sh scripts/audit_checkpoint.sh scripts/tests/test_backup.sh scripts/tests/test_audit_checkpoint.sh scripts/tests/test_rollback_contract.sh
          ./scripts/tests/test_backup.sh
          ./scripts/tests/test_audit_checkpoint.sh
          ./scripts/tests/test_rollback_contract.sh
          chmod +x scripts/notify_ops_failure.sh scripts/tests/test_notify_ops_failure.sh
          ./scripts/tests/test_notify_ops_failure.sh
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.53.0 promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.53.0 promtool check rules /etc/prometheus/rules/lingmirror_alerts.yml
      - name: Validate Alertmanager routing
        run: docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 amtool check-config /etc/alertmanager/alertmanager.yml
      - name: Validate operations delivery contracts
        run: |
          systemd-analyze verify ops/systemd/*.service ops/systemd/*.timer
          chmod +x scripts/tests/test_ops_config_contracts.sh
          ./scripts/tests/test_ops_config_contracts.sh

  # ==========================================
  # PR compliance: validate template checkboxes
  # ==========================================
  pr-compliance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate PR template checkboxes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          chmod +x scripts/verify_pr.py
          echo "$PR_BODY" | python3 scripts/verify_pr.py

  # ==========================================
  # Daily health report (scheduled only)
  # ==========================================
  daily-health-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run daily health report
        run: |
          chmod +x scripts/daily_health_report.sh
          ./scripts/daily_health_report.sh

  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.0
          golangci-lint run ./... --timeout=5m

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: multisell_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run migrations
        run: migrate -path migrations -database "postgresql://postgres:postgres@localhost:5432/multisell_test?sslmode=disable" up
      - name: Verify full migration lifecycle on an isolated database
        run: |
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres \
            -c 'CREATE DATABASE lingmirror_migration_verify_ci;'
          chmod +x ../scripts/check_migrations.sh ../scripts/verify_migrations_full.sh
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/lingmirror_migration_verify_ci?sslmode=disable' \
            ../scripts/verify_migrations_full.sh
      - name: Verify approval execution database state machine
        run: |
          chmod +x ../scripts/verify_approval_execution_state_machine.sh
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/multisell_test?sslmode=disable' \
            ../scripts/verify_approval_execution_state_machine.sh
      - name: Verify database backup can be restored
        run: |
          chmod +x ../scripts/backup.sh ../scripts/verify_backup_restore.sh
          BACKUP_DIR=/tmp/lingmirror-backup \
          DB_HOST=localhost DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres DB_NAME=multisell_test \
          BACKUP_REQUIRE_OFFSITE=false ../scripts/backup.sh
          BACKUP_FILE=$(find /tmp/lingmirror-backup -name '*.dump' -type f | head -1)
          DB_HOST=localhost DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres \
          RESTORE_VERIFY_TABLES='user operation_log schema_migrations' \
          ../scripts/verify_backup_restore.sh "$BACKUP_FILE"
      - name: Verify audit checkpoint generation
        run: |
          chmod +x ../scripts/audit_checkpoint.sh
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/multisell_test?sslmode=disable' \
          AUDIT_CHECKPOINT_KEY='ci-checkpoint-key-not-for-production' \
          AUDIT_CHECKPOINT_DIR=/tmp/audit-checkpoints \
          AUDIT_CHECKPOINT_REQUIRE_OFFSITE=false \
          ../scripts/audit_checkpoint.sh
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 && govulncheck ./...
      - name: Run tests
        run: go test ./... -v -count=1 -timeout=180s
        env:
          DB_DRIVER: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: multisell_test
          DB_SSLMODE: disable
      - name: Run race tests for infrastructure kernel
        run: go test -race ./internal/auth ./internal/config ./internal/httpx/middleware ./internal/domain/approval ./internal/domain/operationlog ./internal/domain/integrations ./internal/domain/listingtask ./internal/schemadrift ./internal/platform/actioncatalog ./internal/platform/routecatalog ./internal/platform/command ./internal/platform/eventbus ./internal/platform/scheduler ./internal/platform/toolbridge -count=1 -timeout=180s

  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test --if-present
      - name: Lint
        run: npm run lint

  # ==========================================
  # E2E tests (full stack: backend + frontend + DB)
  # ==========================================
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-next/e2e
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: multisell_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.12"
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/e2e/package-lock.json
      - name: Install migrate CLI
        working-directory: backend-go
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Run migrations
        working-directory: backend-go
        run: migrate -path migrations -database "postgresql://postgres:postgres@localhost:5432/multisell_e2e?sslmode=disable" up
      - name: Check latest migration rollback
        working-directory: ./
        run: scripts/check_migrations.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/multisell_e2e?sslmode=disable
      - name: Seed E2E data
        run: |
          cd ../..
          chmod +x scripts/e2e_seed.sh
          ./scripts/e2e_seed.sh
        env:
          DB_DRIVER: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: multisell_e2e
          DB_SSLMODE: disable
      - name: Start backend
        working-directory: backend-go
        run: |
          go run cmd/server/main.go > /tmp/lingmirror-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lingmirror-backend.log
          exit 1
        env:
          DB_DRIVER: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: multisell_e2e
          DB_SSLMODE: disable
          SERVER_PORT: "8080"
          JWT_SECRET: e2e-test-secret-do-not-use-in-production
      - name: Install frontend dependencies (for web server)
        run: cd .. && npm ci
      - name: Install e2e dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          E2E_API_BASE: http://localhost:8080
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            frontend-next/e2e/playwright-report/
            frontend-next/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload backend log on E2E failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log-${{ github.run_id }}
          path: /tmp/lingmirror-backend.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop backend
        if: always()
        run: pkill -f "cmd/server/main.go" 2>/dev/null || true

  # ==========================================
  # Push Docker images to GitHub Container Registry
  # ==========================================
  push-images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [governance-checks, go-lint, go-test, next-build, e2e-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          V=$(cat VERSION 2>/dev/null || echo "0.0.0")
          echo "backend=ghcr.io/${{ github.repository }}/backend:v${V}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${{ github.repository }}/frontend:v${V}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend-go
          push: true
          tags: ${{ steps.meta.outputs.backend }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend-next
          push: true
          tags: ${{ steps.meta.outputs.frontend }}
