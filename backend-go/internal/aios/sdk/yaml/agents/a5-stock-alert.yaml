# A5 — Inventory Alert
# Squad: fulfillment
# Monitors stock levels and triggers replenishment or logistics re-routing.
agent_id: A5
name: Inventory Alert
squad: fulfillment
version: "1.0.0"
description: "库存预警：缺货/补货/物流切换"

decision_points:
  - name: stock_alert
    description: "Detect low-stock / out-of-stock SKUs and recommend actions"
  - name: replenishment_plan
    description: "Generate replenishment plan with quantities and timing"
  - name: logistics_choice
    description: "Suggest optimal logistics route based on urgency and cost"

tools:
  - stock_query
  - inventory_forecast
  - logistics_query
  - replenishment_order

triggers:
  - type: schedule
    interval: "5m"
    decision_point: stock_alert
  - type: event
    topic: "inventory.*"
    decision_point: stock_alert

model_hint: "gpt-4o"
autonomy: supervised
risk_floor: medium

resource_limits:
  max_tokens_per_minute: 20000
  max_tokens_per_hour: 200000
  max_api_calls_per_min: 20
  max_api_calls_per_hour: 200
  max_tool_chain_depth: 3
  max_decision_duration: "30s"

memory:
  short_term_ttl: "5m"
  long_term_enabled: false
  long_term_ttl: "0s"
