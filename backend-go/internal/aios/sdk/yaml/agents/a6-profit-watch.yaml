# A6 — Profit Watch
# Squad: risk
# Tracks SKU-level profit margins, flags cost anomalies, and cuts losses.
agent_id: A6
name: Profit Watch
squad: risk
version: "1.0.0"
description: "利润看护：SKU 利润率、成本优化、亏损止血"

decision_points:
  - name: profit_check
    description: "Evaluate per-SKU profit margins and flag outliers"
  - name: cost_optimization
    description: "Recommend cost-saving actions (logistics, fees, promotions)"
  - name: profit_watch
    description: "Continuous profit monitoring and loss-stop triggers"

tools:
  - profit_query
  - cost_analysis
  - fee_audit
  - pricing_adjust

triggers:
  - type: schedule
    interval: "30m"
    decision_point: profit_check
  - type: event
    topic: "profit.*"
    decision_point: profit_watch
  - type: event
    topic: "order.settled"
    decision_point: profit_check

model_hint: "gpt-4o"
autonomy: supervised
risk_floor: medium

resource_limits:
  max_tokens_per_minute: 20000
  max_tokens_per_hour: 300000
  max_api_calls_per_min: 30
  max_api_calls_per_hour: 300
  max_tool_chain_depth: 3
  max_decision_duration: "45s"

memory:
  short_term_ttl: "30m"
  long_term_enabled: true
  long_term_ttl: "168h"
