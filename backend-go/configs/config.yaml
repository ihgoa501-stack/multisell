server:
  port: 8080
  mode: debug  # debug | release | test
  version: "0.2.1"
  read_header_timeout: 5s
  read_timeout: 60s
  write_timeout: 0s       # SSE/streaming responses; operation contexts enforce execution deadlines
  idle_timeout: 120s
  shutdown_timeout: 10s
  max_header_bytes: 1048576
  max_request_body_bytes: 33554432
  swagger_enabled: true

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: multisell
  sslmode: disable  # override to "require" for production via DB_SSLMODE env
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  schemas:
    - order_module
    - finance_module
    - inventory_module
    - sku_module
    - settlement_module
  search_path: public,order_module,finance_module,inventory_module,sku_module,settlement_module

redis:
  addr: localhost:6379
  password: ""
  db: 0

cors:
  allowed_origins: "*"  # 开发环境允许所有来源；生产环境通过 CORS_ALLOWED_ORIGINS 覆盖

metrics:
  enabled: true  # 开启 /metrics 端点供 Prometheus 抓取

jwt:
  secret: dev-secret-change-in-production
  key_id: current
  previous_keys_json: ""
  expiry_hours: 24
  refresh_expiry_hours: 168
  registration_enabled: true  # production compose forces false; Owner accounts use the approved bootstrap/reset process

llm:
  daily_budget_usd: 0       # 0 = unlimited; set to cap daily LLM spend in USD
  provider: openai           # openai | anthropic | stub
  api_key: ""                # set via LLM_API_KEY env var

prism:
  base_url: ""               # Prism 服务地址, 如 http://prism:8080
  api_key: ""                # Prism API key
  timeout: 30                # HTTP 超时秒数
  enabled: false             # 是否启用 Prism 图片合规
  strict: true               # Prism 服务异常时: true=阻塞, false=警告后继续用原图发布

log:
  level: debug
  format: console  # console | json

schemadrift:
  enabled: true
  on_drift: "warn"
